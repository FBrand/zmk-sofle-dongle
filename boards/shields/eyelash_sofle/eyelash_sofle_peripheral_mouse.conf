CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_BACKLIGHT=n
# Standard timings for better compatibility
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ---------------------------------------------------------
# DEBUG LOGGING (Uncomment these to enable USB serial logs)
# ---------------------------------------------------------
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_LOG=y
CONFIG_PAW3395_LOG_LEVEL_DBG=y

CONFIG_SPI=y

CONFIG_ZMK_POINTING=y
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_PAW3395=y
CONFIG_REPORT_CPI=y
# CONFIG_PAW3395_REPORT_INTERVAL_MIN=12
# CONFIG_PAW3395_LOG_LEVEL_DBG=y
# CONFIG_PAW3395_INIT_POWER_UP_EXTRA_DELAY_MS=3000

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


CONFIG_VFX_RGBLED_INDICATOR=y
CONFIG_VFX_LDO_PIN=y
CONFIG_VFX_CHRG_PIN=y
