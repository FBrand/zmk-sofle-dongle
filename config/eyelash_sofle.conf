# go to sleep after one hour (1*60*60*1000ms)

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_ZMK_SLEEP=y

CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Aggressive scanning for new peripherals
CONFIG_BT_SCAN_WITH_IDENTITY=y

CONFIG_BT_BAS=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=3
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=n

CONFIG_ZMK_DONGLE_DISPLAY_WPM=n

#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=90

CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# MOUSE
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_POINTING=y
CONFIG_PAW3395=y
CONFIG_REPORT_CPI=y

CONFIG_SPI=y

CONFIG_ZMK_SLEEP=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

#macos logo open this config
#CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y

# USB Spoofing
CONFIG_ZMK_KEYBOARD_NAME="Elite Keyboard"
CONFIG_USB_DEVICE_VID=0x03f0
CONFIG_USB_DEVICE_PID=0x034a
CONFIG_USB_DEVICE_MANUFACTURER="Chicony"
#CONFIG_ZMK_USB_BOOT=y
